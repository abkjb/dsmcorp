---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: signature
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD_STRONG_32_CHARS"
  REPLICATION_PASSWORD: "CHANGE_ME_REPLICATION_PASSWORD_32_CHARS"
  POSTGRES_USER: "esup_user"

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: signature
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD_32_CHARS"

---
# eSup-Signature Application Secrets
apiVersion: v1
kind: Secret
metadata:
  name: esup-signature-secrets
  namespace: signature
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_64_CHARS_MINIMUM"
  APP_SECRET: "CHANGE_ME_APP_SECRET_64_CHARS_MINIMUM"
  LDAP_PASSWORD: "CHANGE_ME_LDAP_PASSWORD_IF_ENABLED"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD_IF_ENABLED"

---
# TLS Secret (HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: signature-tls
  namespace: signature
type: kubernetes.io/tls
data:
  # Generate with: openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
  # Then base64 encode: cat cert.pem | base64 -w 0 and cat key.pem | base64 -w 0
  tls.crt: ""
  tls.key: ""

---
# Docker Registry Secret (for private container images)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: signature
type: kubernetes.io/dockercfg
data:
  .dockercfg: "eyJnaGNyLmlvIjp7ImF1dGgiOiJDSEp2ZEhSbGNtTmZjMk52Y0dVPSIsImVtYWlsIjoiY2xvdWQtYWRtaW5AZXhhbXBsZS5jb20ifX0="

---
# OAuth2 Proxy Secrets (if using OAuth for authentication)
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: signature
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: "CHANGE_ME_TO_YOUR_CLIENT_ID"
  OAUTH2_PROXY_CLIENT_SECRET: "CHANGE_ME_TO_YOUR_CLIENT_SECRET"
  OAUTH2_PROXY_COOKIE_SECRET: "CHANGE_ME_BASE64_COOKIE_SECRET"

---
# Backup Credentials Secret (for S3/Azure backups)
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: signature
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_AWS_SECRET_KEY"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "signature-backups"

---
# NOTE: IMPORTANT SECURITY INSTRUCTIONS
#
# 1. NEVER commit real secrets to Git!
#
# 2. Generate strong passwords:
#    openssl rand -base64 32
#
# 3. Create secret from file:
#    kubectl create secret generic secret-name \
#      --from-file=key=file.txt \
#      -n signature --dry-run=client -o yaml > secret.yaml
#
# 4. For Production, use one of:
#    - Sealed Secrets: https://sealed-secrets.netlify.app/
#    - External Secrets: https://external-secrets.io/
#    - HashiCorp Vault: https://www.vaultproject.io/
#    - AWS Secrets Manager: https://aws.amazon.com/secrets-manager/
#    - Azure Key Vault: https://azure.microsoft.com/en-us/services/key-vault/
#
# 5. Apply secrets:
#    kubectl apply -f k8s/02-secrets.yaml
#
# 6. Verify (never in production!):
#    kubectl get secrets -n signature
#    kubectl describe secret esup-signature-secrets -n signature
